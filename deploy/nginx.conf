# Пример для nginx (если сервер работает без Docker: node server/index.js --rooms --trust-proxy
#   --public-url https://quiz.example.ru --host 127.0.0.1).
# Сертификат можно получить через certbot: certbot --nginx -d quiz.example.ru
server {
    listen 80;
    server_name quiz.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quiz.example.ru;

    ssl_certificate     /etc/letsencrypt/live/quiz.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.example.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # WebSocket (кнопки игроков)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
